openapi: 3.0.3
info:
  title: Projeto Selene — API
  description: >
    Sistema de compliance documental e Kanban para fiscalização de contratos
    públicos municipais. Ver `backend/README.md` para arquitetura, setup e
    detalhes de autenticação.


    **Nota sobre nomes de campo:** as respostas JSON usam PascalCase (ex:
    `NumeroContrato`, não `numero_contrato`) — reflexo dos nomes dos campos
    Go nos models, que não têm tags `json` explícitas hoje (exceto onde
    indicado). Os corpos de **requisição** (POST/PATCH) usam snake_case
    normalmente. Essa assimetria é uma inconsistência conhecida, documentada
    como está — não idealizada.
  version: "1.0.0"
  license:
    name: Uso interno — Prefeitura
externalDocs:
  description: README do backend (arquitetura, checklist por etapa do Kanban, etc.)
  url: ../README.md

servers:
  - url: http://localhost:8080
    description: Local (docker-compose)

tags:
  - name: Sistema
    description: Health check e métricas — sem autenticação.
  - name: Sessão
    description: Informações do usuário autenticado.
  - name: Login Local
    description: >
      Login tradicional (e-mail/senha) — alternativa ao Keycloak. Contas
      são criadas só por um administrador (POST /admin/users/local); não
      há autocadastro público.
  - name: Referências do Kanban
    description: Tabelas de referência somente-leitura (etapas fixas, tipos de documento).
  - name: Contratos
    description: Cadastro e ciclo de vida dos contratos administrativos.
  - name: Processos de Pagamento
    description: Os "cards" do Kanban — um por mês de referência de um contrato.
  - name: Documentos
    description: Upload e consulta de documentos anexados a um processo.
  - name: Relatório
    description: Geração do Relatório de Pagamento (PDF).
  - name: Radar
    description: Alertas de vigência de contrato, certidão vencida/vencendo e processo parado (Fase 1 do roadmap de módulos).
  - name: Gerador de Documentos
    description: >
      Geração de PDFs oficiais (Notificação de Descumprimento, Atesto,
      Minuta de Aditivo) e verificação pública de autenticidade via QR code
      (Fase 2 do roadmap de módulos).
  - name: Vistorias
    description: >
      Vistorias de campo com registro fotográfico e geolocalização, e o
      "Relatório de Campo" em PDF (Fase 3 do roadmap de módulos).
  - name: Dossiê do Fornecedor
    description: >
      Consolidação por CNPJ de contratos, histórico de notificações de
      descumprimento e Score de Pontualidade (Fase 4 do roadmap de
      módulos).
  - name: SGF — Fiscalização
    description: >
      Adequação estrita à IN SCL Nº 01/2019 e IN SCL Nº 04/2021
      (Prefeitura de Rondonópolis): designação auditável de
      fiscal/gestor/fiscal setorial, acompanhamento paralelo/informativo
      de saldo de empenho e registro/tratativa de ocorrências — ver
      `.claude/plans/projeto-selene-rippling-kite.md` para a Matriz
      Normativa completa. Extensão aditiva do Kanban existente, nenhuma
      rota/campo anterior muda de comportamento.
  - name: Administração
    description: Gestão de contas de usuário — restrito a administradores.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Health check
      description: Verifica a conexão real com o Postgres, não só se o processo está de pé.
      security: []
      responses:
        "200":
          description: Saudável.
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }
        "503":
          description: Dependência (Postgres) indisponível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: indisponível }
                  error: { type: string }

  /metrics:
    get:
      tags: [Sistema]
      summary: Métricas Prometheus
      description: >
        Formato de exposição do Prometheus (text/plain). Sem autenticação por
        convenção do ecossistema — restrinja o acesso por rede em produção.
      security: []
      responses:
        "200":
          description: Métricas no formato Prometheus.
          content:
            text/plain: { schema: { type: string } }

  /api/v1/me:
    get:
      tags: [Sessão]
      summary: Dados do usuário autenticado
      description: Confirma que o token foi validado e o usuário foi resolvido/provisionado (JIT) com sucesso.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  email: { type: string, format: email }
                  is_fiscal: { type: boolean }
                  is_admin: { type: boolean }
                  must_change_password: { type: boolean, description: "true = conta local com senha temporária, precisa trocar antes de continuar." }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /api/v1/auth/login:
    post:
      tags: [Login Local]
      summary: Login tradicional (e-mail/senha)
      description: >
        Rota PÚBLICA (ainda não há sessão) — sujeita a rate limit por IP
        como defesa contra força bruta. Emite um token de acesso aceito
        pelo resto da API exatamente como um token do Keycloak (mesmo
        formato, issuer diferente).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  usuario: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401":
          description: E-mail ou senha inválidos.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/auth/trocar-senha:
    post:
      tags: [Login Local]
      summary: Troca a senha da própria conta
      description: >
        Autenticado (qualquer usuário logado). Contas Keycloak recebem
        400 — a senha delas é gerenciada pelo Keycloak, não pelo Selene.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha_atual, senha_nova]
              properties:
                senha_atual: { type: string, format: password }
                senha_nova: { type: string, format: password, description: "Mínimo 8 caracteres." }
      responses:
        "204": { description: Senha trocada. }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401":
          description: Não autenticado, ou senha atual incorreta.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }

  /api/v1/kanban/etapas:
    get:
      tags: [Referências do Kanban]
      summary: Lista as 6 etapas fixas do funil
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KanbanEtapa" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /api/v1/kanban/tipos-documento:
    get:
      tags: [Referências do Kanban]
      summary: Lista o catálogo de tipos de documento
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TipoDocumento" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /api/v1/radar:
    get:
      tags: [Radar]
      summary: Lista os itens em risco (Radar de Alertas)
      description: >
        Varre contratos e processos ativos e retorna todo item que entra
        em algum dos 3 sinais de alerta: vigência de contrato perto do
        fim, certidão vencida/vencendo anexada a um processo em
        andamento, ou processo parado na mesma etapa do Kanban há muito
        tempo. Sem paginação — a lista é o conjunto completo de itens em
        risco.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemRadar" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /api/v1/contratos:
    get:
      tags: [Contratos]
      summary: Lista contratos (paginado)
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamanho"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResultadoPaginado"
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: "#/components/schemas/Contrato" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      tags: [Contratos]
      summary: Cadastra um novo contrato
      description: Restrito a fiscais habilitados (`IsFiscal=true`). Sujeito a rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovoContratoRequest" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contrato" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/contratos/{id}:
    parameters:
      - $ref: "#/components/parameters/ContratoId"
    get:
      tags: [Contratos]
      summary: Busca um contrato por ID
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contrato" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    patch:
      tags: [Contratos]
      summary: Atualiza campos editáveis do contrato
      description: >
        Só os campos presentes no corpo são alterados. `numero_contrato`,
        `fiscal_id` e `tipo_objeto` não são editáveis por aqui (identidade e
        classificação do contrato).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtualizarContratoRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contrato" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/contratos/{id}/encerrar:
    parameters:
      - $ref: "#/components/parameters/ContratoId"
    post:
      tags: [Contratos]
      summary: Encerra o contrato (soft-close)
      description: >
        Marca `Ativo=false`. Contrato encerrado não aceita novos `POST
        /processos`, mas o histórico continua consultável. Não há reversão
        automática.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contrato" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/contratos/{id}/notificacao:
    parameters:
      - $ref: "#/components/parameters/ContratoId"
    post:
      tags: [Gerador de Documentos]
      summary: Gera a Notificação de Descumprimento (PDF)
      description: Registra o histórico em DocumentoEmitido (Fase 2 do roadmap).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, description: "Motivo da notificação (texto livre)." }
      responses:
        "200":
          description: PDF gerado.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/contratos/{id}/minuta-aditivo:
    parameters:
      - $ref: "#/components/parameters/ContratoId"
    post:
      tags: [Gerador de Documentos]
      summary: Gera a Minuta de Aditivo (PDF)
      description: >
        Justificativa técnica preliminar a partir de um questionário curto
        — não substitui a formalização jurídica definitiva do termo
        aditivo. Registra o histórico em DocumentoEmitido.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MinutaAditivoRequest" }
      responses:
        "200":
          description: PDF gerado.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/verificar/{codigo}:
    parameters:
      - name: codigo
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Gerador de Documentos]
      summary: Verifica a autenticidade de um documento emitido (QR code)
      description: >
        Rota PÚBLICA — fora da autenticação Keycloak, propositalmente: quem
        escaneia o QR code de um Atesto impresso não tem login no Selene.
        Nunca responde 404 pra um código inexistente; sempre 200 com
        `valido=false`.
      security: []
      responses:
        "200":
          description: OK (mesmo para código inválido/inexistente — ver `valido`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificarDocumentoResponse" }

  /api/v1/processos:
    get:
      tags: [Processos de Pagamento]
      summary: Lista processos de uma etapa do Kanban (paginado)
      description: O parâmetro `etapa` é obrigatório — o board sempre navega por coluna.
      parameters:
        - name: etapa
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 6 }
          description: ID da etapa do Kanban (1 a 6).
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamanho"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResultadoPaginado"
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: "#/components/schemas/ProcessoPagamento" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      tags: [Processos de Pagamento]
      summary: Abre um novo processo de pagamento (card)
      description: >
        Sempre entra na Etapa 1. Rejeitado com 400 se o contrato estiver
        encerrado (`Ativo=false`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrato_id, mes_referencia]
              properties:
                contrato_id: { type: string, format: uuid }
                mes_referencia: { type: string, example: "07/2026", description: 'Formato "MM/AAAA".' }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessoPagamento" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/processos/{id}:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    get:
      tags: [Processos de Pagamento]
      summary: Busca um processo por ID
      description: >
        Além dos campos já existentes de ProcessoPagamento, a resposta
        inclui a leitura de Camada 2 do SGF-Rondonópolis
        (estado_fiscalizacao, acao_ou_espera, allowed_actions) — ver
        ProcessoComFiscalizacao e o plano, seção De/Para. Nenhum campo
        anterior muda de nome/tipo.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessoComFiscalizacao" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /api/v1/processos/{id}/avancar:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    post:
      tags: [Processos de Pagamento]
      summary: Avança o processo para a próxima etapa
      description: >
        Só avança se o checklist da etapa atual estiver completo (Seção 5 da
        documentação de domínio). Ao confirmar a Etapa 3, dispara em
        background o envio do pacote digital à empresa contratada.
      responses:
        "200":
          description: Avançou.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessoPagamento" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "422": { $ref: "#/components/responses/ChecklistIncompleto" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/processos/{id}/concluir:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    post:
      tags: [Processos de Pagamento]
      summary: Marca o processo como pago
      description: Só permitido a partir da etapa final (6 — Contabilidade).
      responses:
        "200":
          description: Concluído.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessoPagamento" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/processos/{id}/documentos:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    get:
      tags: [Documentos]
      summary: Lista os documentos anexados ao processo
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentoAnexo" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      tags: [Documentos]
      summary: Anexa um documento ao processo
      description: >
        multipart/form-data. Se o SHA-256 do conteúdo já existir para este
        processo, reaproveita o registro existente em vez de duplicar (não
        cria um novo). Limite de 20MB por arquivo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo_documento_id, arquivo]
              properties:
                tipo_documento_id: { type: integer, description: "ID de um tipo em GET /kanban/tipos-documento." }
                arquivo: { type: string, format: binary }
                data_validade: { type: string, format: date, description: 'Opcional. Formato "AAAA-MM-DD" — só faz sentido pra tipos com ExigeValidade=true (certidões). Alimenta o Radar de Alertas.' }
      responses:
        "201":
          description: Anexado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoAnexo" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "413":
          description: Arquivo excede 20MB.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/processos/{id}/relatorio:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    get:
      tags: [Relatório]
      summary: Gera o Relatório de Pagamento (PDF)
      description: >
        PDF pronto para impressão/assinatura física. Layout funcional
        próprio do Selene, não o modelo oficial da prefeitura (nenhum
        template real foi fornecido — ver README, seção "Limitações").
        SGF-Rondonópolis: inclui as seções de Ocorrências e Empenho
        (acompanhamento paralelo/informativo) quando o processo tiver
        alguma vinculada — omitidas quando não há dado.
      responses:
        "200":
          description: PDF gerado.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /api/v1/processos/{id}/atesto:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    post:
      tags: [Gerador de Documentos]
      summary: Gera o Atesto do processo (PDF, com QR code de verificação)
      description: >
        Folha de Rosto + Termo de Recebimento com QR code embutido, que
        aponta pra `PUBLIC_URL/verificar/{codigo}` (ou só o código em texto
        puro se `PUBLIC_URL` não estiver configurado). Registra o histórico
        em DocumentoEmitido.
      responses:
        "200":
          description: PDF gerado.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/processos/{id}/vistorias:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    get:
      tags: [Vistorias]
      summary: Lista as vistorias do processo
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegistroVistoria" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      tags: [Vistorias]
      summary: Registra uma nova vistoria de campo
      description: >
        Abre o registro; as fotos são anexadas depois, uma a uma, via
        POST /vistorias/{id}/fotos. Latitude/longitude são opcionais — o
        navegador pode negar/não suportar geolocalização.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude: { type: number, format: double, nullable: true }
                longitude: { type: number, format: double, nullable: true }
                observacoes: { type: string }
      responses:
        "201":
          description: Registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistroVistoria" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/vistorias/{id}/fotos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Vistorias]
      summary: Anexa uma foto à vistoria
      description: >
        multipart/form-data, campo "foto". Mesma deduplicação por SHA-256
        de POST /processos/{id}/documentos. Limite de 20MB por arquivo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto: { type: string, format: binary }
      responses:
        "201":
          description: Anexada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FotoVistoria" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "413":
          description: Arquivo excede 20MB.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/vistorias/{id}/relatorio:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Vistorias]
      summary: Gera o Relatório de Campo da vistoria (PDF)
      description: >
        Dados do contrato/processo, coordenadas, observações e as fotos
        anexadas, embutidas no PDF.
      responses:
        "200":
          description: PDF gerado.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /api/v1/contratos/{id}/designacoes:
    parameters:
      - $ref: "#/components/parameters/ContratoId"
    get:
      tags: [SGF — Fiscalização]
      summary: Lista o histórico de designações do contrato
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortariaDesignacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      tags: [SGF — Fiscalização]
      summary: Designa fiscal/suplente/gestor/fiscal setorial
      description: >
        Uma nova designação do mesmo papel revoga automaticamente a
        anterior (DataRevogacao). Papel=FISCAL também sincroniza
        Contrato.FiscalID (IN01 Art.4º-I/Art.6º; IN04 Art.4º-I/Art.10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignarRequest" }
      responses:
        "201":
          description: Designado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortariaDesignacao" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/contratos/{id}/empenhos:
    parameters:
      - $ref: "#/components/parameters/ContratoId"
    get:
      tags: [SGF — Fiscalização]
      summary: Lista os empenhos do contrato
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Empenho" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      tags: [SGF — Fiscalização]
      summary: Abre um novo empenho (registro paralelo/informativo)
      description: >
        Já registra a movimentação INICIAL automaticamente (IN01
        Art.5º-VIII; IN04 Art.5º-XXII) — ver o comentário em
        components/schemas/Empenho sobre isto não ser a fonte de verdade
        orçamentária.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CriarEmpenhoRequest" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Empenho" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/empenhos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SGF — Fiscalização]
      summary: Busca um empenho, com o saldo reconstruído do histórico
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmpenhoComSaldo" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /api/v1/empenhos/{id}/movimentacoes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [SGF — Fiscalização]
      summary: Registra um reforço, anulação ou apropriação de fatura
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrarMovimentacaoRequest" }
      responses:
        "201":
          description: Registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovimentacaoEmpenho" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/processos/{id}/ocorrencias:
    parameters:
      - $ref: "#/components/parameters/ProcessoId"
    get:
      tags: [SGF — Fiscalização]
      summary: Lista as ocorrências do processo
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ocorrencia" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    post:
      tags: [SGF — Fiscalização]
      summary: Registra uma nova ocorrência
      description: >
        Abre no estado REGISTRADA. ContratoID é resolvido automaticamente
        a partir do processo. Enquanto não regularizada, bloqueia
        AVANCAR_ETAPA neste processo (regra de Camada 2, ver o plano).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrarOcorrenciaRequest" }
      responses:
        "201":
          description: Registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ocorrencia" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/ocorrencias/{id}/notificar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [SGF — Fiscalização]
      summary: Transiciona REGISTRADA → NOTIFICADA
      description: Comunicação formal ao Gestor (IN04 Art.5º-XVI).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ocorrencia" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/ocorrencias/{id}/tratar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [SGF — Fiscalização]
      summary: Transiciona NOTIFICADA → EM_TRATAMENTO
      description: O Gestor já definiu as medidas a tomar (IN04 Art.5º-XVII).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ocorrencia" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/ocorrencias/{id}/regularizar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [SGF — Fiscalização]
      summary: Transiciona EM_TRATAMENTO → REGULARIZADA
      description: A partir daqui, esta ocorrência para de bloquear AVANCAR_ETAPA no processo.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ocorrencia" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "429": { $ref: "#/components/responses/MuitasRequisicoes" }

  /api/v1/fornecedores:
    get:
      tags: [Dossiê do Fornecedor]
      summary: Lista um resumo por CNPJ de todos os fornecedores
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FornecedorResumo" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /api/v1/fornecedores/{cnpj}:
    parameters:
      - name: cnpj
        in: path
        required: true
        schema: { type: string }
        description: 'Só dígitos (sem máscara) — ver FornecedorResumo.cnpj.'
        example: "12345678000190"
    get:
      tags: [Dossiê do Fornecedor]
      summary: Monta o dossiê completo do fornecedor
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FornecedorDossie" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /api/v1/servidores:
    get:
      tags: [Usuários]
      summary: Lista uma projeção mínima (ID/Nome/Email) de todos os usuários
      description: >-
        Não é admin-only (ao contrário de /admin/users): usada pra popular
        seletores de servidor, ex. SGF-Rondonópolis "Nova designação".
        ID/Nome/Email já são visíveis a qualquer usuário autenticado hoje
        via Contrato.Fiscal aninhado em /contratos e /processos — esta
        rota não expõe dado novo, só uma forma de listar todo mundo sem
        precisar já conhecer um ContratoID.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServidorOpcao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /api/v1/admin/users:
    get:
      tags: [Administração]
      summary: Lista todos os usuários
      description: Restrito a administradores (`IsAdmin=true`).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /api/v1/admin/users/local:
    post:
      tags: [Administração, Login Local]
      summary: Cria uma conta de login local (e-mail/senha)
      description: >
        Restrito a administradores. Não há autocadastro público — só por
        aqui. A conta nasce com `must_change_password=true`: o usuário
        precisa trocar a senha temporária no primeiro login (ver POST
        /auth/trocar-senha).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha_temporaria]
              properties:
                nome: { type: string }
                email: { type: string, format: email }
                senha_temporaria: { type: string, format: password, description: "Mínimo 8 caracteres." }
                is_fiscal: { type: boolean }
                is_admin: { type: boolean }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Administração]
      summary: Busca um usuário por ID
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    patch:
      tags: [Administração]
      summary: Altera permissões/matrícula de um usuário
      description: Só os campos presentes no corpo são alterados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_fiscal: { type: boolean }
                is_admin: { type: boolean }
                matricula: { type: string }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido pelo Keycloak do realm da prefeitura (validado contra o JWKS — assinatura, expiração, issuer e, opcionalmente, audience).

  parameters:
    ContratoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProcessoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Tamanho:
      name: tamanho
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    NaoAutenticado:
      description: Token ausente, inválido, expirado, ou issuer/audience não batem.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
    Proibido:
      description: Usuário autenticado, mas sem a permissão exigida (IsFiscal/IsAdmin).
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
    RequisicaoInvalida:
      description: "Corpo/parâmetros inválidos, ou regra de negócio violada (ex: contrato encerrado)."
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
    MuitasRequisicoes:
      description: Rate limit excedido para este usuário (rotas de escrita).
      content:
        application/json: { schema: { $ref: "#/components/schemas/ErroSimples" } }
    ChecklistIncompleto:
      description: O checklist obrigatório da etapa atual ainda não está completo.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "checklist incompleto" }
              documentos_pendentes:
                type: array
                items: { type: string }
                example: ["Nota Fiscal / Fatura", "Ordem de Recepção"]

  schemas:
    ErroSimples:
      type: object
      properties:
        error: { type: string }

    ResultadoPaginado:
      type: object
      properties:
        total: { type: integer, example: 42 }
        pagina: { type: integer, example: 1 }
        tamanho_pagina: { type: integer, example: 20 }

    KanbanEtapa:
      type: object
      properties:
        ID: { type: integer, example: 1 }
        Nome: { type: string, example: "Elaborar OF / Pré-Empenho" }
        Posicao: { type: integer, example: 1 }

    TipoDocumento:
      type: object
      properties:
        ID: { type: integer, example: 4 }
        Nome: { type: string, example: "Nota de Empenho" }
        ExigeValidade: { type: boolean, description: "true = tipo que vence (certidões) — o upload aceita 'data_validade'." }

    ItemRadar:
      type: object
      description: Um alerta individual do Radar (Fase 1 do roadmap).
      properties:
        tipo: { type: string, enum: [vigencia_contrato, certidao, processo_parado] }
        nivel: { type: string, enum: [ATENCAO, CRITICO] }
        contrato_id: { type: string, format: uuid }
        numero_contrato: { type: string, example: "125/2026" }
        processo_id: { type: string, format: uuid, nullable: true, description: "Ausente pra alertas de tipo vigencia_contrato (o alerta é do contrato, não de um processo específico)." }
        mensagem: { type: string, example: "Faltam 25 dias para o fim da vigência do contrato" }
        dias_restantes: { type: integer, description: "Negativo quando o prazo já passou (vencido/parado há N dias)." }

    MinutaAditivoRequest:
      type: object
      required: [tipo_aditivo, justificativa]
      properties:
        tipo_aditivo: { type: string, enum: [VALOR, PRAZO, VALOR_E_PRAZO] }
        justificativa: { type: string, description: "Justificativa técnica da necessidade do aditivo." }
        novo_valor: { type: string, description: 'Opcional, texto livre (ex: "R$ 150.000,00"). Preenchido quando tipo_aditivo inclui VALOR.' }
        novo_prazo: { type: string, description: 'Opcional, texto livre (ex: "31/12/2026"). Preenchido quando tipo_aditivo inclui PRAZO.' }

    VerificarDocumentoResponse:
      type: object
      description: Resposta de GET /verificar/{codigo} (Fase 2 do roadmap) — rota pública.
      properties:
        valido: { type: boolean, description: "false = código inexistente/inválido; os demais campos ficam ausentes nesse caso." }
        tipo: { type: string, enum: [NOTIFICACAO_DESCUMPRIMENTO, ATESTO, MINUTA_ADITIVO] }
        numero_contrato: { type: string, example: "125/2026" }
        contratada_nome: { type: string }
        mes_referencia: { type: string, example: "07/2026", description: "Presente só pra documentos amarrados a um processo (ex: Atesto)." }
        gerado_por_nome: { type: string }
        criado_em: { type: string, example: "13/08/2026 14:32" }
        codigo_verificacao: { type: string, example: "SEL-A1B2C3D4E5F60708" }

    RegistroVistoria:
      type: object
      description: Uma vistoria de campo (Fase 3 do roadmap).
      properties:
        ID: { type: string, format: uuid }
        ProcessoPagamentoID: { type: string, format: uuid }
        FiscalID: { type: string, format: uuid }
        Fiscal: { $ref: "#/components/schemas/Usuario" }
        DataHora: { type: string, format: date-time }
        Latitude: { type: number, format: double, nullable: true, description: "Ausente quando o navegador negou/não suportou geolocalização." }
        Longitude: { type: number, format: double, nullable: true }
        Observacoes: { type: string }
        Fotos:
          type: array
          items: { $ref: "#/components/schemas/FotoVistoria" }
        CreatedAt: { type: string, format: date-time }

    FotoVistoria:
      type: object
      description: 'CaminhoStorage (path local no servidor) é omitido de propósito — nunca serializado (json:"-").'
      properties:
        ID: { type: string, format: uuid }
        VistoriaID: { type: string, format: uuid }
        NomeArquivo: { type: string }
        HashArquivo: { type: string }
        CreatedAt: { type: string, format: date-time }

    FornecedorResumo:
      type: object
      description: Uma linha da listagem consolidada por CNPJ (Fase 4 do roadmap).
      properties:
        cnpj: { type: string, description: "Só dígitos, sem máscara — identificador canônico usado na URL do dossiê.", example: "12345678000190" }
        cnpj_formatado: { type: string, description: "Como cadastrado no contrato, só para exibição.", example: "12.345.678/0001-90" }
        nome: { type: string }
        qtd_contratos: { type: integer }
        qtd_contratos_ativos: { type: integer }

    FornecedorDossie:
      type: object
      description: Consolidação completa de um fornecedor (Fase 4 do roadmap).
      properties:
        cnpj: { type: string, example: "12345678000190" }
        cnpj_formatado: { type: string, example: "12.345.678/0001-90" }
        nome: { type: string }
        contratos:
          type: array
          items: { $ref: "#/components/schemas/Contrato" }
        notificacoes:
          type: array
          description: 'Só DocumentoEmitido do tipo NOTIFICACAO_DESCUMPRIMENTO — o "histórico de penalidades".'
          items: { $ref: "#/components/schemas/DocumentoEmitido" }
        score_pontualidade:
          type: number
          format: double
          nullable: true
          description: >
            Percentual (0-100) de transições de etapa do Kanban que
            aconteceram em até 15 dias (mesmo limiar do Radar de Alertas
            pra "processo parado"). null quando não há transições
            suficientes pra calcular — distinto de 0%.

    DocumentoEmitido:
      type: object
      description: Um PDF oficial gerado pelo Selene (Fase 2 do roadmap) — histórico consultável no Dossiê do Fornecedor.
      properties:
        ID: { type: string, format: uuid }
        ContratoID: { type: string, format: uuid }
        ProcessoPagamentoID: { type: string, format: uuid, nullable: true }
        Tipo: { type: string, enum: [NOTIFICACAO_DESCUMPRIMENTO, ATESTO, MINUTA_ADITIVO] }
        Motivo: { type: string }
        GeradoPorID: { type: string, format: uuid }
        GeradoPor: { $ref: "#/components/schemas/Usuario" }
        CodigoVerificacao: { type: string, example: "SEL-A1B2C3D4E5F60708" }
        CreatedAt: { type: string, format: date-time }

    Usuario:
      type: object
      description: 'KeycloakID (claim "sub" do token OIDC) e PasswordHash (bcrypt) são omitidos de propósito — nunca serializados (json:"-"): o primeiro é um identificador interno sem uso na UI, o segundo nunca deveria sair do servidor em nenhuma resposta.'
      properties:
        ID: { type: string, format: uuid }
        Nome: { type: string }
        Email: { type: string, format: email }
        IsFiscal: { type: boolean }
        IsAdmin: { type: boolean }
        MustChangePassword: { type: boolean, description: "true = conta local com senha temporária definida pelo admin, ainda não trocada." }
        Matricula: { type: string }
        CriadoEm: { type: string, format: date-time }
        AtualizadoEm: { type: string, format: date-time }

    ServidorOpcao:
      type: object
      description: 'Projeção mínima de Usuario (só ID/Nome/Email) usada pra popular seletores de servidor — ver GET /servidores.'
      properties:
        ID: { type: string, format: uuid }
        Nome: { type: string }
        Email: { type: string, format: email }

    Contrato:
      type: object
      properties:
        ID: { type: string, format: uuid }
        NumeroContrato: { type: string, example: "125/2026" }
        PortariaNomeacao: { type: string }
        DataAssinatura: { type: string, format: date }
        ContratadaNome: { type: string }
        ContratadaCNPJ: { type: string }
        ContratadaEmail: { type: string, format: email }
        FiscalID: { type: string, format: uuid }
        Fiscal: { $ref: "#/components/schemas/Usuario" }
        TipoObjeto: { type: string, enum: [CONSUMO, PERMANENTE, SERVICO] }
        Ativo: { type: boolean, description: "false = contrato encerrado (soft-close)." }
        DataVigenciaFim: { type: string, format: date, nullable: true, description: "Alimenta o Radar de Alertas — null se não cadastrada." }
        ExigeFiscalizacaoTerceirizacao: { type: boolean, description: "Camada 2 (regra do SGF): marca contrato de mão de obra terceirizada, sujeito à IN SCL Nº 04/2021 — acrescenta os documentos do Art.9º-XXXII ao checklist da Etapa 5." }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }

    NovoContratoRequest:
      type: object
      required: [numero_contrato, data_assinatura, contratada_nome, contratada_cnpj, fiscal_id, tipo_objeto]
      properties:
        numero_contrato: { type: string, example: "125/2026" }
        portaria_nomeacao: { type: string }
        data_assinatura: { type: string, example: "2026-01-15", description: 'Formato "AAAA-MM-DD".' }
        contratada_nome: { type: string }
        contratada_cnpj: { type: string }
        contratada_email: { type: string, format: email }
        fiscal_id: { type: string, format: uuid, description: "Precisa ser um usuário com IsFiscal=true." }
        tipo_objeto: { type: string, enum: [CONSUMO, PERMANENTE, SERVICO] }
        data_vigencia_fim: { type: string, format: date, description: 'Opcional. Formato "AAAA-MM-DD" — alimenta o Radar de Alertas.' }
        exige_fiscalizacao_terceirizacao: { type: boolean, description: "Opcional, default false. Ver Contrato.ExigeFiscalizacaoTerceirizacao." }

    AtualizarContratoRequest:
      type: object
      properties:
        portaria_nomeacao: { type: string }
        contratada_nome: { type: string }
        contratada_cnpj: { type: string }
        contratada_email: { type: string, format: email }
        data_vigencia_fim: { type: string, format: date, description: 'Formato "AAAA-MM-DD". Enviar string vazia limpa a vigência cadastrada.' }
        exige_fiscalizacao_terceirizacao: { type: boolean, description: "Ver Contrato.ExigeFiscalizacaoTerceirizacao." }

    ProcessoPagamento:
      type: object
      properties:
        ID: { type: string, format: uuid }
        ContratoID: { type: string, format: uuid }
        Contrato: { $ref: "#/components/schemas/Contrato" }
        MesReferencia: { type: string, example: "07/2026" }
        EtapaAtualID: { type: integer, minimum: 1, maximum: 6 }
        EtapaAtual: { $ref: "#/components/schemas/KanbanEtapa" }
        Status: { type: string, enum: [Ativo, Concluido] }
        EmpenhoID: { type: string, format: uuid, nullable: true, description: "SGF-Rondonópolis: liga este processo ao Empenho paralelo/informativo quando a fatura do mês foi apropriada contra ele. Null pra processos que não adotam esse acompanhamento." }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }

    ProcessoComFiscalizacao:
      description: >
        Resposta de GET /processos/{id} — todos os campos de
        ProcessoPagamento mais a leitura de Camada 2 computada pelo SGF
        (nunca persistida). Ver o plano, seção De/Para.
      allOf:
        - $ref: "#/components/schemas/ProcessoPagamento"
        - type: object
          properties:
            estado_fiscalizacao:
              type: string
              enum: [A_EXECUTAR_CONFERIR, EM_ANALISE_EXTERNA, DOCUMENTAR_ATESTAR, PENDENCIA_DEVOLVIDO, CONCLUIDO]
              description: "Rótulo de Camada 2 (regra do SGF, não da norma) derivado da etapa atual — vira PENDENCIA_DEVOLVIDO independente da etapa quando há Ocorrencia aberta vinculada."
            acao_ou_espera:
              type: string
              enum: [ACAO_FISCAL, ESPERA_EXTERNA]
              description: "Se a etapa atual exige ação ativa do fiscal ou está em tramitação fora do seu controle direto (ex: Contabilidade/Tesouraria)."
            allowed_actions:
              type: array
              items: { type: string, enum: [AVANCAR_ETAPA, CONCLUIR_PAGAMENTO, ANEXAR_DOCUMENTO, REGISTRAR_OCORRENCIA, REGISTRAR_MOVIMENTACAO_EMPENHO] }
              description: "Vocabulário fechado que o frontend usa pra decidir quais botões mostrar — substitui a checagem client-side de EtapaAtualID/Status que existia antes."

    DocumentoAnexo:
      type: object
      description: 'CaminhoStorage (path local no servidor) é omitido de propósito — nunca serializado (json:"-").'
      properties:
        ID: { type: string, format: uuid }
        ProcessoPagamentoID: { type: string, format: uuid }
        TipoDocumentoID: { type: integer }
        TipoDocumento: { $ref: "#/components/schemas/TipoDocumento" }
        NomeArquivo: { type: string, description: "Sanitizado no upload (sem componentes de caminho ou caracteres de controle)." }
        HashArquivo: { type: string, description: "SHA-256 (hex) do conteúdo." }
        EnviadoPorID: { type: string, format: uuid }
        EnviadoPor: { $ref: "#/components/schemas/Usuario" }
        DataUpload: { type: string, format: date-time }
        DataValidade: { type: string, format: date, nullable: true, description: "Só preenchida pra tipos com ExigeValidade=true (certidões)." }

    PortariaDesignacao:
      type: object
      description: >
        Histórico auditável de designação de fiscal/suplente/gestor/fiscal
        setorial por contrato (IN01 Art.4º-I/Art.6º; IN04 Art.4º-I/Art.10).
        Imutável — uma nova designação do mesmo papel revoga a anterior
        (DataRevogacao), nunca sobrescreve.
      properties:
        ID: { type: string, format: uuid }
        ContratoID: { type: string, format: uuid }
        ServidorID: { type: string, format: uuid }
        Servidor: { $ref: "#/components/schemas/Usuario" }
        Papel: { type: string, enum: [FISCAL, FISCAL_SUPLENTE, GESTOR, FISCAL_SETORIAL] }
        NumeroPortaria: { type: string }
        PublicadoDiorondon: { type: string }
        DataDesignacao: { type: string, format: date }
        DataRevogacao: { type: string, format: date, nullable: true, description: "Preenchida quando esta designação é substituída por uma nova do mesmo papel." }
        CriadoPorID: { type: string, format: uuid }
        CreatedAt: { type: string, format: date-time }

    DesignarRequest:
      type: object
      required: [servidor_id, papel]
      properties:
        servidor_id: { type: string, format: uuid }
        papel: { type: string, enum: [FISCAL, FISCAL_SUPLENTE, GESTOR, FISCAL_SETORIAL] }
        numero_portaria: { type: string }
        publicado_diorondon: { type: string }
        data_designacao: { type: string, example: "2026-01-15", description: 'Opcional. Formato "AAAA-MM-DD" — default é a data atual.' }

    Empenho:
      type: object
      description: >
        Registro PARALELO/informativo de empenho — apoia a obrigação do
        FISCAL de controlar o saldo (IN01 Art.5º-VIII; IN04 Art.5º-XXII),
        NÃO é fonte de verdade orçamentária (essa é exclusiva dos sistemas
        corporativos da prefeitura).
      properties:
        ID: { type: string, format: uuid }
        ContratoID: { type: string, format: uuid }
        NumeroEmpenho: { type: string }
        DataEmissao: { type: string, format: date }
        ValorInicial: { type: integer, format: int64, description: "Centavos." }
        CreatedAt: { type: string, format: date-time }

    EmpenhoComSaldo:
      description: Resposta de GET /empenhos/{id} — inclui o saldo reconstruído do histórico de movimentações.
      allOf:
        - $ref: "#/components/schemas/Empenho"
        - type: object
          properties:
            saldo: { type: integer, format: int64, description: "Centavos. Sempre recalculado a partir de MovimentacaoEmpenho, nunca lido de um campo denormalizado." }

    CriarEmpenhoRequest:
      type: object
      required: [numero_empenho, data_emissao, valor_inicial]
      properties:
        numero_empenho: { type: string }
        data_emissao: { type: string, example: "2026-01-15", description: 'Formato "AAAA-MM-DD".' }
        valor_inicial: { type: integer, format: int64, description: "Centavos, maior que zero." }

    MovimentacaoEmpenho:
      type: object
      description: Lançamento imutável no histórico de um Empenho.
      properties:
        ID: { type: string, format: uuid }
        EmpenhoID: { type: string, format: uuid }
        Tipo: { type: string, enum: [INICIAL, REFORCO, ANULACAO, FATURA_APROPRIADA] }
        Valor: { type: integer, format: int64, description: "Centavos, sempre positivo — o sinal é implícito pelo Tipo." }
        ProcessoPagamentoID: { type: string, format: uuid, nullable: true, description: "Só preenchido quando Tipo=FATURA_APROPRIADA." }
        Observacao: { type: string }
        RegistradoPorID: { type: string, format: uuid }
        CreatedAt: { type: string, format: date-time }

    RegistrarMovimentacaoRequest:
      type: object
      required: [tipo, valor]
      properties:
        tipo: { type: string, enum: [REFORCO, ANULACAO, FATURA_APROPRIADA], description: "INICIAL não é aceito aqui — é criado automaticamente por POST /contratos/{id}/empenhos." }
        valor: { type: integer, format: int64, description: "Centavos, maior que zero." }
        processo_pagamento_id: { type: string, format: uuid, description: "Opcional — usar quando tipo=FATURA_APROPRIADA." }
        observacao: { type: string }

    Ocorrencia:
      type: object
      description: >
        Registro formal de ocorrência da execução contratual (IN01
        Art.3º-III/Art.5º-IV,IX; IN04 Art.3º-VIII/Art.5º-VIII,XVI). Ciclo
        de vida linear REGISTRADA→NOTIFICADA→EM_TRATAMENTO→REGULARIZADA
        (simplificação de Camada 2 — ver o plano, seção "Lacunas
        conhecidas", sobre o ramo de escalonamento da IN04 Art.5º-XVII
        ainda não modelado).
      properties:
        ID: { type: string, format: uuid }
        ContratoID: { type: string, format: uuid }
        ProcessoPagamentoID: { type: string, format: uuid, nullable: true }
        Descricao: { type: string }
        Estado: { type: string, enum: [REGISTRADA, NOTIFICADA, EM_TRATAMENTO, REGULARIZADA] }
        RegistradoPorID: { type: string, format: uuid }
        RegistradoPor: { $ref: "#/components/schemas/Usuario" }
        DataNotificacaoGestor: { type: string, format: date, nullable: true }
        DataRegularizacao: { type: string, format: date, nullable: true }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }

    RegistrarOcorrenciaRequest:
      type: object
      required: [descricao]
      properties:
        descricao: { type: string }
