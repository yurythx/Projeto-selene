name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo PR/branch quando um novo push chega —
# não faz sentido gastar minutos de CI validando um commit já superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Item de roadmap (ver backend/README.md, "security-review automatizado
  # no CI") — a action oficial da Anthropic (anthropics/claude-code-
  # security-review), não o /code-review interativo deste próprio Claude
  # Code (esse é uma ferramenta de sessão, não algo que rode sozinho no
  # GitHub Actions). Só em pull_request: a action faz diff contra o SHA
  # base do PR (fetch-depth: 2, não precisa de todo o histórico nem de
  # origin/HEAD já resolvido localmente — ao contrário de rodar o
  # /code-review manualmente numa branch que ainda não foi empurrada,
  # isto aqui só existe DEPOIS que o PR já existe no GitHub, então o SHA
  # base sempre está disponível).
  #
  # Exige o secret de repositório CLAUDE_API_KEY (Settings → Secrets and
  # variables → Actions) — uma chave de API da Anthropic habilitada tanto
  # pra Claude API quanto pra Claude Code. Sem o secret configurado, este
  # job falha (de propósito: silenciar/pular a falha esconderia que a
  # revisão de segurança nunca rodou). Ver também a recomendação da
  # própria action de exigir aprovação manual pra rodar workflows de
  # contribuidores externos (Settings → Actions → "Require approval for
  # all outside collaborators") — evita prompt injection via PR de
  # estranho lendo o segredo.
  security-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Revisão de segurança automatizada (Claude)
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}

  backend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Sobe um Postgres real como serviço do job — os testes de integração
    # (internal/repository, internal/service) exigem um banco de verdade
    # (ver internal/testutil.OpenTestDB) e aqui ele está sempre disponível,
    # ao contrário do ambiente de quem roda `go test` localmente sem Docker.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: selene
          POSTGRES_PASSWORD: selene
          POSTGRES_DB: projeto_selene
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selene -d projeto_selene"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verificar formatação (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Os arquivos abaixo não estão formatados com gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # golangci-lint-action@v6 (binário via go install, na toolchain
        # do runner) falhou duas vezes com "exit code 3" sem detalhe —
        # o endpoint de logs da API do GitHub exige permissão de admin
        # mesmo em repo público, então não deu pra investigar a causa
        # exata. Trocado por invocar a imagem Docker oficial diretamente
        # (mesma versão usada localmente, v2.12.2) — reproduzi esse
        # comando localmente, com recursos equivalentes ao runner padrão
        # (2 CPUs, 7GB) e cache frio, e terminou limpo ("0 issues") em
        # ~3m30s. Perde o cache/anotações inline da action, mas é o
        # caminho comprovado enquanto a causa raiz não é confirmada.
        run: docker run --rm -v "$GITHUB_WORKSPACE/backend:/app" -w /app golangci/golangci-lint:v2.12.2 golangci-lint run ./...

      - name: go build
        run: go build ./...

      - name: go test (unitários + integração)
        env:
          TEST_DATABASE_URL: "host=localhost port=5432 user=selene password=selene dbname=projeto_selene sslmode=disable"
        # -p 1: os pacotes internal/repository e internal/service rodam
        # testes de integração contra o MESMO Postgres externo — go test
        # roda pacotes diferentes em paralelo por padrão, e dois pacotes
        # migrando/truncando o mesmo banco ao mesmo tempo pode gerar
        # deadlock no Postgres (transitório, mas evitável). -p 1 serializa
        # a execução por pacote.
        run: go test ./... -v -race -p 1

  backend-docker-build:
    runs-on: ubuntu-latest
    needs: backend-lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker do backend
        run: docker build -t projeto-selene-backend:ci ./backend

  frontend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

      - name: Build (typecheck + next build)
        # Segredos reais (Keycloak, AUTH_SECRET) não existem no CI — estes
        # valores só precisam satisfazer os módulos avaliados durante a
        # coleta de dados de página do `next build` (mesmo motivo do
        # ENV placeholder no Dockerfile). Nada disso vai pra imagem final.
        env:
          API_URL: http://localhost:8080
          AUTH_SECRET: ci-placeholder-nao-e-segredo-real
          AUTH_KEYCLOAK_ID: ci-placeholder
          AUTH_KEYCLOAK_SECRET: ci-placeholder
          AUTH_KEYCLOAK_ISSUER: http://localhost:8081/realms/ci
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend-lint-and-test
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        # Sobe um stub do backend em memória (e2e/mock-backend.ts) + a
        # própria app via `next build && next start` — não depende do
        # backend Go real nem do Keycloak real. A sessão é injetada
        # direto via cookie (e2e/fixtures/auth.ts), pulando o login
        # interativo — ver o comentário lá para o porquê (não faz
        # sentido usar credenciais do Keycloak de produção da prefeitura
        # em CI).
        run: npm run test:e2e

      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  frontend-docker-build:
    runs-on: ubuntu-latest
    needs: frontend-lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker do frontend
        run: docker build -t projeto-selene-frontend:ci ./frontend
