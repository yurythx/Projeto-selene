# Orquestra o monorepo inteiro (frontend + backend + Postgres + Redis +
# Jaeger). Cada serviço aponta pro seu próprio subdiretório — nenhum build
# usa a raiz do repo como contexto.
#
# O frontend usa o Keycloak real da prefeitura (não um serviço local) — as
# credenciais do client (AUTH_KEYCLOAK_*) e AUTH_SECRET vêm do .env da raiz,
# nunca commitadas. Ver frontend/README.md para como criar o client.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-selene}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-selene}
      POSTGRES_DB: ${DB_NAME:-projeto_selene}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-selene} -d ${DB_NAME:-projeto_selene}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP (o backend exporta pra cá)

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-selene}
      DB_PASSWORD: ${DB_PASSWORD:-selene}
      DB_NAME: ${DB_NAME:-projeto_selene}
      DB_SSLMODE: disable
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      STORAGE_DIR: /app/storage
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-projeto-selene-backend}
    volumes:
      - storage_data:/app/storage

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
      # OBRIGATÓRIO no build "standalone" do Next.js rodando em Docker: o
      # server standalone passa hostname/porta explícitos pro Next
      # (HOSTNAME=0.0.0.0, ver Dockerfile), e quando esses dois valores são
      # conhecidos o Next monta a URL absoluta da requisição a partir
      # DELES, não do header Host recebido (next/dist/server/next-server.js,
      # attachRequestMeta) — sem AUTH_URL, o redirect_uri mandado pro
      # Keycloak sai como "http://0.0.0.0:3000/..." em vez de
      # "http://localhost:3000/...", e o Keycloak rejeita por não bater com
      # o Valid Redirect URI cadastrado no client. AUTH_URL faz o
      # next-auth reescrever a origem da requisição antes disso acontecer
      # (ver node_modules/next-auth/lib/env.js, reqWithEnvURL).
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER}
      # Rede interna do compose — nunca o host/porta publicado pro browser.
      API_URL: http://backend:8080

volumes:
  postgres_data:
  storage_data:
