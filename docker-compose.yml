services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-selene}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-selene}
      POSTGRES_DB: ${DB_NAME:-projeto_selene}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-selene} -d ${DB_NAME:-projeto_selene}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-selene}
      DB_PASSWORD: ${DB_PASSWORD:-selene}
      DB_NAME: ${DB_NAME:-projeto_selene}
      DB_SSLMODE: disable
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      STORAGE_DIR: /app/storage
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - storage_data:/app/storage

volumes:
  postgres_data:
  storage_data:
