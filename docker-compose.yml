# Orquestra o monorepo (backend + Postgres agora; frontend entra aqui
# quando existir). Cada serviço aponta pro seu próprio subdiretório —
# nenhum build usa a raiz do repo como contexto.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-selene}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-selene}
      POSTGRES_DB: ${DB_NAME:-projeto_selene}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-selene} -d ${DB_NAME:-projeto_selene}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-selene}
      DB_PASSWORD: ${DB_PASSWORD:-selene}
      DB_NAME: ${DB_NAME:-projeto_selene}
      DB_SSLMODE: disable
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      STORAGE_DIR: /app/storage
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
    volumes:
      - storage_data:/app/storage

  # frontend:
  #   build: ./frontend
  #   ...  (ainda não implementado)

volumes:
  postgres_data:
  storage_data:
